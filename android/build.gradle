plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.openwearables'
version = '0.2.0'

android {
  namespace "expo.modules.openwearables"
  defaultConfig {
    versionCode 1
    versionName "0.2.0"
  }
  lintOptions {
    abortOnError false
  }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // Gutsy fork: the SDK is a sibling submodule consumed as a Gradle project, not a published
    // artifact (apps/mobile/plugins/withOpenWearables.js wires the include). Upstream pins
    // com.openwearables.health:sdk:0.11.2 here; our submodule IS 0.11.2 + the auth-recovery patch.
    implementation project(':open_wearables_android_sdk')
}